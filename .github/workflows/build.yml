# يبني APK على كل push (بعد ما يوصل مشروع Gradle حقيقي عبر unpack-zip.yml أو push مباشر).
# التوقيع: أسرار KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
# أو secrets/signing/keystore.properties في المستودع الخاص. بدون توقيع: APK بمفتاح مؤقت، بدون Release.
# كل push على main بتوقيع صحيح ينشر Release vX.Y.Z-bN مع APK وversion.json يقرؤهما التطبيق للتحديث الذاتي.

name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check project is present
        id: check
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا مشروع Gradle بعد — رفع zip وسيُفك ويُبنى تلقائياً."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: steps.check.outputs.ready == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.check.outputs.ready == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PBUILD_NUMBER=$GITHUB_RUN_NUMBER assembleRelease

      - name: Collect APK
        if: steps.check.outputs.ready == 'true'
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          BASE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2)
          CODE=$((BASE * 10000 + GITHUB_RUN_NUMBER))
          mkdir -p dist
          APK="${NAME}-v${VERSION}-b${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/$APK"
          SIZE=$(stat -c %s "dist/$APK")
          NOTES=$(python3 -c "import json,os,sys; p=sys.argv[1]; print(json.dumps(open(p).read() if os.path.exists(p) else ''))" "docs/releases/v$VERSION.md")
          echo "{\"version\":\"$VERSION\",\"build\":$GITHUB_RUN_NUMBER,\"code\":$CODE,\"tag\":\"v$VERSION-b$GITHUB_RUN_NUMBER\",\"apk\":\"$APK\",\"size\":$SIZE,\"notes\":$NOTES}" > dist/version.json
          cat dist/version.json | head -c 400; echo
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::بلا أسرار توقيع — APK بمفتاح مؤقت، لن يُنشر Release ولن يظهر التحديث داخل التطبيق."
          fi
          ls -l dist

      - name: Upload APK artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: steps.check.outputs.ready == 'true' && github.ref_name == 'main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          PREV=$(git tag --list 'v*' --sort=-creatordate | grep -v "^$TAG$" | head -n1)
          {
            if [ -f "docs/releases/v$VERSION.md" ]; then cat "docs/releases/v$VERSION.md"; echo; fi
            echo "## تغييرات هذا البناء"
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~20..HEAD"; fi
            git log --no-merges --pretty='- %s' $RANGE 2>/dev/null || true
          } > /tmp/notes.md
          gh release create "$TAG" "dist/${NAME}-v${VERSION}-b${GITHUB_RUN_NUMBER}.apk" dist/version.json \
            --title "إنجاز $VERSION — بناء $GITHUB_RUN_NUMBER" \
            --notes-file /tmp/notes.md --target "$(git rev-parse HEAD)" --latest
