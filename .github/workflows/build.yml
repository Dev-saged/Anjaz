# يبني APK على كل push (بعد ما يوصل مشروع Gradle حقيقي عبر unpack-zip.yml أو push مباشر).
# التوقيع: أسرار KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
# أو secrets/signing/keystore.properties في المستودع الخاص. بدون توقيع: APK بمفتاح مؤقت، بدون Release.
# كل push على main بتوقيع صحيح ينشر Release vX.Y.Z-bN مع APK وversion.json يقرؤهما التطبيق للتحديث الذاتي.

name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check project is present
        id: check
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا مشروع Gradle بعد — رفع zip وسيُفك ويُبنى تلقائياً."
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        if: steps.check.outputs.ready == 'true' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.check.outputs.ready == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PBUILD_NUMBER=$GITHUB_RUN_NUMBER assembleRelease

      - name: Collect APK
        if: steps.check.outputs.ready == 'true'
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          BASE=$(grep '^VERSION_CODE=' gradle.properties | cut -d= -f2)
          CODE=$((BASE * 10000 + GITHUB_RUN_NUMBER))
          mkdir -p dist
          BASEN="${NAME}-v${VERSION}-b${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/$BASEN.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/$BASEN-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/$BASEN-armeabi-v7a.apk"
          python3 - "$VERSION" "$GITHUB_RUN_NUMBER" "$CODE" "$BASEN" "docs/releases/v$VERSION.md" <<'PY'
          import json, os, sys
          v, n, code, base, notes = sys.argv[1:6]
          sz = lambda f: os.path.getsize("dist/" + f)
          abis = {a: f"{base}-{a}.apk" for a in ("arm64-v8a", "armeabi-v7a")}
          out = {
              "version": v, "build": int(n), "code": int(code), "tag": f"v{v}-b{n}",
              "apk": f"{base}.apk", "size": sz(f"{base}.apk"),
              "apks": abis, "sizes": {a: sz(f) for a, f in abis.items()},
              "notes": open(notes).read() if os.path.exists(notes) else "",
          }
          json.dump(out, open("dist/version.json", "w"), ensure_ascii=False)
          PY
          cat dist/version.json | head -c 400; echo
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::بلا أسرار توقيع — APK بمفتاح مؤقت، لن يُنشر Release ولن يظهر التحديث داخل التطبيق."
          fi
          ls -l dist

      - name: Upload APK artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: steps.check.outputs.ready == 'true' && github.ref_name == 'main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          PREV=$(git tag --list 'v*' --sort=-creatordate | grep -v "^$TAG$" | head -n1)
          {
            if [ -f "docs/releases/v$VERSION.md" ]; then cat "docs/releases/v$VERSION.md"; echo; fi
            echo "## تغييرات هذا البناء"
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD~20..HEAD"; fi
            git log --no-merges --pretty='- %s' $RANGE 2>/dev/null || true
          } > /tmp/notes.md
          gh release create "$TAG" dist/*.apk dist/version.json \
            --title "إنجاز $VERSION — بناء $GITHUB_RUN_NUMBER" \
            --notes-file /tmp/notes.md --target "$(git rev-parse HEAD)" --latest
