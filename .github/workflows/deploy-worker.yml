name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/worker/**'
      - 'backend/firebase/firestore.rules'
concurrency: { group: deploy-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test
        working-directory: backend/worker
        run: npm run rules && npm test
      - name: Deploy
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::أضف السرّين CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID في Settings > Secrets > Actions"; exit 1
          fi
          npm install --no-audit --no-fund && npx wrangler deploy
      - name: Publish Firestore rules
        run: |
          sleep 10
          for i in 1 2 3; do
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST https://anjaz-api.dev-mr07.workers.dev/v1/system/rules || echo 000)
            cat out.json; echo
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::تعذّر نشر قواعد Firestore (انظر الرسالة أعلاه)"; exit 1
