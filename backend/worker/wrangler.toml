name = "anjaz-api"
main = "src/index.js"
compatibility_date = "2025-07-01"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_PROJECT_ID"
EMAIL_DOMAIN = "users.anjaz.local"
MEDIA_TTL_DAYS = "90"
ALLOWED_ORIGIN = ""

[[d1_databases]]
binding = "DB"
database_name = "anjaz"
database_id = "REPLACE_WITH_D1_ID"

[triggers]
crons = ["*/15 * * * *", "0 21 * * *"]
